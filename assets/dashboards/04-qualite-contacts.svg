<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Suivi de la qualité des contacts</title><desc id="desc">Reconstitution améliorée de la vue Power BI consacrée aux emails, téléphones, adresses, mutuelles et types de compte.</desc>
